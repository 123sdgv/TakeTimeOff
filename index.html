<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>假条</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="win95-window">
        <!-- 顶部深蓝色标题栏 -->
        <div class="title-bar">
            <div class="title-bar-text">📄 假条.exe</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize">_</button>
                <button aria-label="Maximize">□</button>
                <button aria-label="Close">×</button>
            </div>
        </div>

        <!-- 窗口主体内容 -->
        <div class="window-body">
            <div class="label-text">当前可用假条数量：</div>
            
            <!-- 凹陷风格的大数字显示屏 -->
            <div class="display-screen">
                <span id="counter">0</span>
            </div>

            <!-- 加减按钮区 -->
            <div class="button-group">
                <button id="btn-minus" class="win95-btn">➖</button>
                <button id="btn-plus" class="win95-btn">➕</button>
            </div>
        </div>

        <!-- 底部状态栏：显示实时时间和自动+2规则 -->
        <div class="status-bar">
            <div class="status-field" id="current-time">正在获取系统时间...</div>
            <div class="status-field" id="rule-tip">每周自动 +2</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
